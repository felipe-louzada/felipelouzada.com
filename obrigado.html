<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagem recebida — Felipe Louzada</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%230d0b09'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='28' font-weight='bold' fill='%23c8a96e'>FL</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0b09; --paper: #111009; --ink: #e8e0d0;
      --ink-muted: #8a8070; --accent: #c8a96e;
      --accent-dim: #7a6340; --rule: #2a2520;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; line-height: 1.7;
      overflow-x: hidden; cursor: auto;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035; pointer-events: none; z-index: 1000;
    }
    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.4rem 4rem; border-bottom: 1px solid var(--rule);
      background: rgba(13,11,9,0.88); backdrop-filter: blur(8px);
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em;
      color: var(--ink); text-decoration: none;
    }

    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 8rem 4rem 4rem;
    }
    .thank-you-wrap {
      max-width: 600px; text-align: center;
      animation: fadeIn 0.8s ease forwards;
    }
    .thank-you-num {
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      color: var(--accent); letter-spacing: 0.2em;
      margin-bottom: 1.5rem; display: block;
    }
    .thank-you-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900; line-height: 1; letter-spacing: -0.02em;
      color: var(--ink); margin-bottom: 1.5rem;
    }
    .thank-you-title em { font-style: italic; color: var(--accent); }
    .thank-you-rule {
      width: 3rem; height: 1px; background: var(--accent-dim);
      margin: 0 auto 2rem;
    }
    .thank-you-text {
      font-size: 1.2rem; font-style: italic; font-weight: 300;
      color: var(--ink-muted); line-height: 1.7; margin-bottom: 3rem;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 1rem;
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--ink); text-decoration: none;
      border: 1px solid var(--accent-dim); padding: 0.9rem 2rem;
      transition: all 0.3s; position: relative; overflow: hidden;
    }
    .btn-back::before {
      content: ''; position: absolute; inset: 0;
      background: var(--accent); transform: scaleX(0);
      transform-origin: left; transition: transform 0.35s ease;
    }
    .btn-back:hover::before { transform: scaleX(1); }
    .btn-back span { position: relative; z-index: 1; }
    .btn-back:hover { color: var(--bg); border-color: var(--accent); }

    footer {
      border-top: 1px solid var(--rule); padding: 2rem 4rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-copy { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; color: var(--ink-muted); text-transform: uppercase; }
    .footer-logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; font-style: italic; color: var(--rule); user-select: none; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent-dim); }

    @media (max-width: 768px) {
      nav { padding: 1.2rem 1.5rem; }
      main { padding: 7rem 1.5rem 3rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Felipe Louzada</a>
</nav>

<main>
  <div class="thank-you-wrap">
    <span class="thank-you-num">Mensagem recebida</span>
    <h1 class="thank-you-title">Obrigado pelo <em>contato.</em></h1>
    <div class="thank-you-rule"></div>
    <p class="thank-you-text">
      Sua mensagem chegou até mim. Entrarei em contato assim que possível — boas perguntas merecem respostas cuidadosas.
    </p>
    <a href="index.html" class="btn-back">
      <span>← Voltar ao início</span>
    </a>
  </div>
</main>

<footer>
  <span class="footer-copy">© 2026 — Felipe Louzada</span>
  <span class="footer-logo">FL</span>
  <span class="footer-copy">Feito com cuidado</span>
</footer>

</body>
</html>
